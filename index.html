const DEFAULT={version:1,selected:[],route:'one3',fields:{},checks:{},quiz:{},done:[],page:0};
let state=structuredClone(DEFAULT),storageOK=true;
function validState(s){return s&&s.version===1&&Array.isArray(s.selected)&&s.selected.every(x=>BOOKS.some(b=>b.id===x))&&new Set(s.selected).size===s.selected.length&&['one3','one12','three1'].includes(s.route)&&s.fields&&typeof s.fields==='object'&&!Array.isArray(s.fields)&&Object.values(s.fields).every(x=>typeof x==='string')&&s.checks&&typeof s.checks==='object'&&!Array.isArray(s.checks)&&Object.values(s.checks).every(x=>typeof x==='boolean')&&s.quiz&&typeof s.quiz==='object'&&!Array.isArray(s.quiz)&&Object.entries(s.quiz).every(([k,v])=>/^\w+_\d+$/.test(k)&&Number.isInteger(v)&&v>=0&&v<=10)&&Array.isArray(s.done)&&s.done.every(x=>Number.isInteger(x)&&x>=0&&x<8)&&Number.isInteger(s.page)&&s.page>=0&&s.page<8;}
try{const raw=localStorage.getItem('panel-nyc-v1');if(raw){const s=JSON.parse(raw);if(validState(s))state=s;}}catch(e){storageOK=false;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem('panel-nyc-v1',JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}document.getElementById('saveStatus').textContent=storageOK?'Saved on this browser':'Use Save / restore to keep a backup';}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.classList.add('hidden'),4500);}
function field(key,label,hint='',type='textarea'){let input=type==='textarea'?'<textarea data-field="'+key+'" rows="3">'+esc(state.fields[key]||'')+'</textarea>':'<input type="'+type+'" data-field="'+key+'" value="'+esc(state.fields[key]||'')+'">';return '<label class="field">'+label+(hint?'<small>'+hint+'</small>':'')+input+'</label>';}
function check(key,label){return '<label class="check"><input type="checkbox" data-check="'+key+'" '+(state.checks[key]?'checked':'')+'><span>'+label+'</span></label>';}
function selectedBooks(){return BOOKS.filter(b=>state.selected.includes(b.id));}
function routeValid(){const counts=[0,0,0,0];selectedBooks().forEach(b=>counts[b.level]++);return state.route==='one3'?counts[3]>=1:state.route==='one12'?counts[1]>=1&&counts[2]>=1:counts[1]>=3;}
function routeName(){return {one3:'One level-3 comic',one12:'One level-1 + one level-2 comic',three1:'Three level-1 comics'}[state.route];}

function quiz(group){return QUIZZES[group].map((q,i)=>{const key=group+'_'+i,answer=state.quiz[key];return '<div class="quiz"><fieldset><legend>'+String(i+1).padStart(2,'0')+'. '+q[0]+'</legend>'+q[1].map((a,j)=>'<label><input type="radio" name="q_'+key+'" value="'+j+'" '+(answer===j?'checked':'')+'>'+a+'</label>').join('')+'</fieldset><button data-quiz="'+key+'">Check answer</button><div id="feedback_'+key+'" class="feedback '+(answer!==undefined&&answer!==q[2]?'wrong':'')+'" role="status">'+(answer===undefined?'':(answer===q[2]?'✓ Correct. ':'Try again. ')+q[3])+'</div></div>';}).join('');}

function home(){return '<section class="hero"><div class="hero-copy"><span class="tag">READING + SPEAKING · B1</span><h1>A new city.<br>A new story.<br><em>Your own voice.</em></h1><p>Step into a graphic novel. Find the details that stay with you. Bring them to a conversation worth having.</p><button class="accent" data-go="1">Choose your first book →</button><div class="small muted" style="margin-top:16px">14 titles · 3 reading routes · 1 conversation</div></div><div class="hero-art">'+skyline()+'<div class="art-label">FROM THE PAGE → TO YOUR POINT OF VIEW</div></div></section><div class="section-title"><h2>Your mission, in three moves</h2><span class="eyebrow" style="margin:0">Start here</span></div><div class="grid"><article class="card"><div class="step-icon">01 /</div><h3>Read & discover</h3><p class="small">Choose a valid reading route. Notice what the words and pictures make you think and feel.</p></article><article class="card"><div class="step-icon">02 /</div><h3>Make it your own</h3><p class="small">Collect specific scenes, shape your opinions and connect the setting to your NYC research.</p></article><article class="card"><div class="step-icon">03 /</div><h3>Keep it going</h3><p class="small">Talk with a classmate and your teacher. Listen, give reasons and ask questions.</p></article></div><div class="callout"><strong>The conversation: about 5–7 minutes overall</strong><p class="small">Part 1: introduce and explore a topic (2–3 minutes). Part 2: respond and exchange ideas (2–3 minutes). These are approximate section times; follow your teacher’s timing. Home practice uses shorter 1–2-minute answers.</p></div><details><summary>What will my teacher look for?</summary><div class="inside"><p>Language, pronunciation, interactive communication, fluency and content. Each criterion has five score descriptions.</p><p class="small">You do not need a perfect accent. Focus on being understood, developing relevant ideas and helping the conversation flow. Your teacher makes the assessment.</p><button data-go="7">Explore the rubric →</button></div></details><div class="section-title"><h2>Quick mission check</h2></div>'+quiz('mission')+field('name','Your name or initials','Optional. This appears on your downloaded workbook.','text')+'<p class="small muted">Your writing stays in this browser. Use Save / restore for a backup or to move devices. Nothing is automatically sent to your teacher.</p>';}
function books(){return intro(1,'Find your next story.','Choose the route that suits you, then open the comic-book folder in Microsoft Teams. The colour shows the difficulty level assigned by your teacher.')+'<div class="grid"><button class="route '+(state.route==='one3'?'selected':'')+'" data-route="one3" aria-pressed="'+(state.route==='one3')+'"><strong>01 / One deep dive</strong><small>Read one level-3 comic</small></button><button class="route '+(state.route==='one12'?'selected':'')+'" data-route="one12" aria-pressed="'+(state.route==='one12')+'"><strong>02 / Mix your reading</strong><small>Read one level 1 + one level 2</small></button><button class="route '+(state.route==='three1'?'selected':'')+'" data-route="three1" aria-pressed="'+(state.route==='three1')+'"><strong>03 / Three perspectives</strong><small>Read three level-1 comics</small></button></div><div class="status '+(routeValid()?'':'invalid')+'" role="status">'+(routeValid()?'✓ Your selection meets this reading route. Finish reading the selected books before checking them off.':'Choose books below to meet your route: '+routeName()+'.')+'<div class="small">'+state.selected.length+' selected'+(state.selected.length?' · '+selectedBooks().map(b=>esc(b.title)).join(' / '):'')+'</div></div><div class="callout"><strong>Your library is in Microsoft Teams</strong><p class="small">Open your English class team and find the folder containing the comic-book PDFs. Match the titles below to the filenames. The exact folder link has not been provided.</p><button data-teams>Open Teams & folder guidance ↗</button></div><details><summary>Not sure where to start? Try a three-page preview.</summary><div class="inside"><ol><li>Look at the cover and first three pages in Teams.</li><li>Notice the balance between pictures and words. Can you follow the action?</li><li>Find one image or question that makes you want to continue.</li><li>Choose a route you can finish. Ask your teacher if you need help choosing.</li></ol><p class="small">The questions on these cards are reading invitations, not plot summaries. Read the actual book to discover your own answers.</p></div></details><div class="legend"><span class="level l1">GREEN · Level 1</span><span class="level l2">AMBER · Level 2</span><span class="level l3">RED · Level 3</span></div><div class="book-grid">'+BOOKS.map(b=>'<article class="book '+(state.selected.includes(b.id)?'selected':'')+'" data-level="'+b.level+'"><div class="book-stripe"></div><div class="book-content"><div><span class="level l'+b.level+'">Level '+b.level+'</span></div><h3>'+b.title+'</h3><div class="author">'+b.author+'</div><p class="hook">'+b.hook+'</p><button data-book="'+b.id+'" aria-pressed="'+state.selected.includes(b.id)+'">'+(state.selected.includes(b.id)?'✓ Selected · remove':'+ Add to my reading')+'</button></div></article>').join('')+'</div>';}
function reading(){return intro(2,'Read the words. Read the pictures.','Read your chosen books before completing your interpretation. Use this stop as a companion: pause, notice, jot down a detail, then keep reading.')+'<div class="grid two"><div class="card"><h3>Your three-pass reading routine</h3><ol><li><strong>Follow the story.</strong> Who is here? What is happening? Read for the overall meaning first.</li><li><strong>Look again.</strong> Notice framing, facial expressions, colour and the space between panels.</li><li><strong>Connect and question.</strong> What does a detail suggest? How does it affect you?</li></ol><p class="small">Unknown word? Try the picture and sentence first. Look it up if it blocks meaning, then record a useful example.</p></div><div class="card"><h3>A small visual vocabulary</h3><p class="small"><strong>Panel:</strong> one framed moment.<br><strong>Gutter:</strong> the space between panels.<br><strong>Caption:</strong> narration or context in a box.<br><strong>Speech bubble:</strong> a character’s spoken words.<br><strong>Close-up:</strong> a detailed view that directs attention.<br><strong>Palette:</strong> the colours used to create an effect.</p><p class="small">Ask: What do the pictures tell me that the words do not?</p></div></div><div class="section-title"><h2>Look closer: a two-panel moment</h2><span class="tag">ORIGINAL PRACTICE SCENE</span></div><div class="grid two"><div class="mini-panel"><span class="caption">Outside the station. 9:15 p.m.</span><div class="scene-shapes" aria-hidden="true">▥ ▥ ▥</div><span class="speech">What if I get lost?</span><p class="small" style="margin:15px 0 0">A small figure pauses beside a dark station entrance.</p></div><div class="mini-panel light"><span class="caption">A moment later…</span><span class="speech">Excuse me. Can you help?</span><div class="scene-shapes" aria-hidden="true">↗ ◯ ◯</div><p class="small" style="margin:0">The figure steps towards another traveller; the framing moves closer.</p></div></div><p class="small muted" style="margin-top:12px">This invented mini-scene is for practice. Use evidence from your chosen comics in the real task.</p>'+quiz('reading')+'<div class="section-title"><h2>Your reading log</h2><button data-go="1">Change selection</button></div>'+(selectedBooks().length?selectedBooks().map(b=>'<details open><summary>'+esc(b.title)+' <span class="level l'+b.level+'">Level '+b.level+'</span></summary><div class="inside">'+check('read_'+b.id,'I have finished reading this selected comic.')+field('log_'+b.id,'What stayed with you?','Record at least one page or scene reference, a visual or verbal detail, your interpretation and a question. You can add several entries.')+'</div></details>').join(''):'<div class="callout warm">Select your books at Stop 2 to create a reading log for each one.</div>')+field('vocab','My words from the reading','Word or phrase → meaning in this context → your own example.')+check('reading_evidence','I can locate the scenes I want to discuss.');}

function city(){return intro(3,'The city is part of the story.','A setting can shape the choices characters make, the obstacles they face and the mood you feel. Start with evidence, then connect it to what you know.')+'<div class="chip-row">'+Object.keys(BOROUGHS).map(b=>'<button data-borough="'+b+'" aria-pressed="'+(borough===b)+'">'+b+'</button>').join('')+'</div><div class="borough-content"><div class="eyebrow">Five boroughs · One city</div><h2>'+borough+'</h2><p>'+BOROUGHS[borough]+'</p><p class="small">NYC’s boroughs are Manhattan, Brooklyn, Queens, the Bronx and Staten Island. A borough is a large administrative part of the city; a neighbourhood is a smaller area within it.</p><a class="small" href="https://portal.311.nyc.gov/article/?kanumber=KA-02877" target="_blank" rel="noopener">Source: New York City government ↗</a></div><div class="callout warm"><strong>Check the setting of your actual book.</strong><p class="small">The assignment uses an NYC lens, but the reading list includes other and fictional places. Gotham is fictional; Ms. Marvel’s Kamala Khan is based in Jersey City, New Jersey. If your story is elsewhere, explain its actual setting and make a supported comparison with NYC. Ask your teacher which connection to emphasise.</p><p class="source-links"><a href="https://www.dc.com/blog/2024-05-08/where-are-dc-s-cities-located" target="_blank" rel="noopener">DC: fictional cities</a> · <a href="https://www.marvel.com/comics/discover/1426/ms-marvel-kamala-khan" target="_blank" rel="noopener">Marvel: Kamala Khan</a></p></div><div class="grid"><div class="card"><h3>Place → action</h3><p class="small">Does a crowded street, a rooftop, a home or a train affect what the character can do? Find a scene.</p></div><div class="card"><h3>Visuals → mood</h3><p class="small">How do empty space, light, shadows, colour or panel size influence the atmosphere?</p></div><div class="card"><h3>Research → interpretation</h3><p class="small">What did your borough research help you recognise? What surprised you or challenged an expectation?</p></div></div>'+field('city_actual','Where does my story actually take place?','Name the selected book and setting. Is it real, fictional or a mixture? Add evidence.')+field('city_link','My research-to-story connection','I learned… from… In the comic I noticed… This connection or contrast suggests…')+quiz('city');}
function toolkit(){return intro(4,'Give your ideas the right words.','Practise language you can actually use. Choose the tense that matches your meaning; you do not need to force every form into the conversation.')+'<div class="callout"><strong>A useful answer pattern</strong><p>Idea → reason → evidence → connection</p><p class="small">“I found the scene tense <strong>because</strong> the character seems trapped. <strong>For example</strong>, the narrow panel cuts off the exit. <strong>This made me feel</strong> uneasy.”</p></div><details open><summary>01 / Tenses in context</summary><div class="inside">'+GRAMMAR.map(g=>'<details><summary>'+g[0]+'</summary><div class="inside"><p>'+g[1]+'</p><p class="phrases">'+g[2]+'</p><p class="small muted">'+g[3]+'</p></div></details>').join('')+quiz('grammar')+'</div></details><details><summary>02 / Adjectives and opposites</summary><div class="inside"><p class="small">Supplementary practice bank: the assignment refers to an adjective list, but that list was not attached. Use your class list too, if you have one.</p><div class="grid two"><div class="phrases"><strong>Characters</strong><br>brave ↔ fearful<br>generous ↔ selfish<br>confident ↔ insecure<br>loyal ↔ disloyal<br>honest ↔ dishonest</div><div class="phrases"><strong>Setting and response</strong><br>crowded ↔ deserted<br>lively ↔ quiet<br>hopeful ↔ hopeless<br>predictable ↔ unpredictable<br>tense ↔ relaxed</div></div><p class="small" style="margin-top:14px">Opposites depend on context. Choose a precise word, then explain it with evidence.</p>'+quiz('adjectives')+'</div></details><details open><summary>03 / Build your personal phrase bank</summary><div class="inside"><p>Write 2–3 useful phrases for each function, one per line. You may adapt these examples.</p>'+FUNCTIONS.map(f=>'<div class="phrases">'+f[2].join('<br>')+'</div>'+field('phrase_'+f[0],f[1],'Choose phrases you can use naturally. One phrase per line.')).join('')+'<div class="phrases"><strong>Keep it moving:</strong> “What about you?” · “I see your point, but…” · “Let me think about that…” · “Could you tell me more?”</div></div></details><details><summary>04 / Conversation choices</summary><div class="inside">'+quiz('interaction')+'</div></details><details><summary>05 / Speak clearly and calmly</summary><div class="inside"><ol><li>Underline the important words in a short answer. Stress them when speaking.</li><li>Split long sentences into thought groups. Pause between ideas.</li><li>Check unfamiliar words with a dictionary’s audio, then practise them in a sentence.</li><li>Use a comfortable pace. Ask your partner which words were hard to understand.</li><li>Breathe, look up and allow yourself thinking time.</li></ol><p class="small">Aim for clear communication, not an imitation accent.</p></div></details><p class="small">Optional resources from the assignment: <a target="_blank" rel="noopener" href="https://www.bbc.co.uk/learningenglish/english/features/themed_weeks_speaking">BBC speaking practice</a> · <a target="_blank" rel="noopener" href="https://www.bbc.co.uk/learningenglish/english/features/tenses_with_georgie">Tenses with Georgie</a></p>';}
function prepare(){return intro(5,'Turn your reading into ideas.','Prepare for every topic, even though the actual task gives you a choice of prompts. Keep notes in your own words and use examples from the books you really read.')+'<div class="callout"><strong>Think in ideas, not a memorised script.</strong><p class="small">Start with your point, add a reason and specific evidence, then close with a personal connection or conclusion. For each topic, prepare 1–2 follow-up questions and possible responses.</p></div>'+(!state.selected.length?'<div class="callout warm">Choose your reading at Stop 2 so your workbook identifies the books you discuss.</div>':'<p class="small"><strong>Your reading:</strong> '+selectedBooks().map(b=>esc(b.title)).join(' · ')+'</p>')+TOPICS.map((t,i)=>'<details class="topic" '+(i===0?'open':'')+'><summary><span class="number">0'+(i+1)+'</span>'+t[1]+'</summary><div class="inside"><p>'+t[2]+'</p><details><summary>Need a starting point?</summary><div class="inside"><p class="phrases">'+t[3]+'</p><p class="small">Possible question: '+t[4]+'</p><p class="small">These are scaffolds. Make the interpretation your own.</p></div></details><div class="note-grid">'+field(t[0]+'_idea','1. My opening idea','Introduce your point and name the relevant book.')+field(t[0]+'_evidence','2. Supporting details and evidence','Give a reason and a page/panel or identifiable scene. Explain the effect.')+field(t[0]+'_connection','3. My connection and conclusion','Link to yourself, your research or the wider theme, then conclude.')+field(t[0]+'_questions','4. Follow-up questions and possible responses','Write 1–2 questions, each with a possible response.')+'</div>'+field(t[0]+'_cue','5. My keyword cue','Choose 3–6 keywords for speaking practice. Avoid a full script.','text')+check('topic_'+t[0],'I can explain this idea aloud and point to evidence.')+'</div></details>').join('')+'<details class="topic"><summary><span class="number">＋</span>Creative connection · optional</summary><div class="inside"><p>Describe an object or image that represents your response, make a small mood board or illustration, or act out a moment if you feel comfortable. Explain how it connects to your interpretation.</p>'+field('creative','My optional creative idea','Describe it here. You can create the actual object, image or performance separately.')+'</div></details>';}

function timerText(){return Math.floor(timerRemaining/60)+':'+String(timerRemaining%60).padStart(2,'0');}
function rehearse(){return intro(6,'Let the conversation happen.','Practise aloud, then improve one thing. Use keywords, listen closely and respond to what your partner actually says.')+'<div class="grid two"><div class="card timer-card"><div class="eyebrow">Your rehearsal timer</div><label class="field" style="text-align:left">Practice mode<select id="timerMode"><option value="120" '+(timerSeconds===120?'selected':'')+'>Home answer · up to 2 minutes</option><option value="180" '+(timerSeconds===180?'selected':'')+'>Part 1 or Part 2 · up to 3 minutes</option><option value="360" '+(timerSeconds===360?'selected':'')+'>Full conversation · 6 minutes</option></select></label><div class="timer" id="timerDisplay" role="timer" aria-label="Time remaining">'+timerText()+'</div><p class="small muted" id="timerStatus">'+(timerInterval?'Timer running':'Ready when you are')+'</p><div class="actions"><button class="accent" id="timerStart">'+(timerInterval?'Pause':'Start')+'</button><button id="timerReset">Reset</button></div><p class="small muted" style="margin-top:18px">Home practice: aim for 1–2 minutes. Full task: about 5–7 minutes, following your teacher’s timing.</p></div><div><div class="prompt-card"><div class="eyebrow">Start a conversation</div><p id="promptText">'+PROMPTS[promptIndex]+'</p><button id="nextPrompt">Next prompt ↻</button></div><div class="callout"><strong>Listen → respond → invite</strong><p class="small">“That’s interesting because…”<br>“Which scene shows that?”<br>“I saw it differently. For me…”</p></div></div></div><div class="section-title"><h2>Your keyword cards</h2></div><button id="showCues">Show / hide my cues</button><div id="cueCards" class="hidden" style="margin-top:16px">'+TOPICS.map(t=>'<div class="card" style="margin-bottom:10px"><strong>'+t[1]+'</strong><p>'+esc(state.fields[t[0]+'_cue']||'Add your own keywords in Stop 6.')+'</p></div>').join('')+'</div><details open><summary>A simple partner routine</summary><div class="inside"><ol><li>Choose a prompt. Speaker A develops an answer with evidence.</li><li>Speaker B listens and asks a relevant follow-up question.</li><li>Speaker A answers fully and invites B’s perspective.</li><li>Keep exchanging ideas. Swap roles and choose another prompt.</li><li>Give one specific strength and one useful next step.</li></ol><p class="small">Practising alone? Say an answer aloud, then answer a follow-up question from your workbook. This helps preparation; a partner will make the interaction practice more realistic.</p></div></details><details><summary>Notice what works in a model conversation</summary><div class="inside"><p class="small muted">Adapted from the assignment’s illustrative <em>Shadows Over Manhattan</em> example. This is not one of the 14 reading choices.</p><p><strong>A:</strong> What do you think of Mia?</p><p><strong>B:</strong> I think she is loyal because she puts her friends first. For example, she helps them stop a robbery even though she loses a gallery opportunity. That choice shows how hard it is to balance her two lives. What would you have done?</p><p><strong>A:</strong> I can understand her decision, but I would find it difficult. How do the pictures show her stress?</p><div class="phrases">Notice: an opinion → a reason → a concrete example → an interpretation → a return question. The follow-up builds on what was said.</div></div></details>'+field('rehearsal','My rehearsal reflection','Date / mode / approximate time / what worked / one change for next time.')+field('peer','Partner feedback','One clear strength and one specific next step.')+check('rehearsed','I have practised aloud and tried responding to follow-up questions.');}
function readiness(){let topicOK=TOPICS.every(t=>['idea','evidence','connection','questions','cue'].every(k=>(state.fields[t[0]+'_'+k]||'').trim()));let phraseOK=FUNCTIONS.every(f=>(state.fields['phrase_'+f[0]]||'').split('\n').filter(x=>x.trim()).length>=2);return [
['Choose enough books for your selected route',routeValid()],['Finish the selected books and add reading evidence',selectedBooks().length>0&&selectedBooks().every(b=>state.checks['read_'+b.id]&&(state.fields['log_'+b.id]||'').trim())],['Complete all six topic plans and keyword cues',topicOK],['Add at least two phrases per function, one per line',phraseOK],['Practise aloud and record a reflection',!!state.checks.rehearsed&&!!(state.fields.rehearsal||'').trim()],['Reflect on all five rubric criteria',RUBRIC.every((r,i)=>!!state.fields['rubric_'+i])],['Complete the exit ticket', ['exit_evidence','exit_question','exit_strength','exit_next','exit_confidence','exit_support'].every(k=>(state.fields[k]||'').trim())]];}
function readyHTML(){return '<ul class="readiness">'+readiness().map(r=>'<li class="'+(r[1]?'ready':'')+'">'+(r[1]?'✓ ':'○ ')+r[0]+'</li>').join('')+'</ul><p class="small muted">This checks completion, not the quality of your ideas. Use the rubric and feedback to judge quality.</p>';}
function reflect(){return intro(7,'Own your next step.','Look back at your reading and rehearsal. Be honest about what is ready and choose one useful improvement.')+'<div class="card"><h3>Your readiness check</h3><div id="readiness">'+readyHTML()+'</div></div><div class="section-title"><h2>How did your rehearsal go?</h2><span class="tag">B1 SELF-ASSESSMENT</span></div><p class="small">Choose the description that best matches your rehearsal. These are self-reflection scores, not teacher grades.</p>'+RUBRIC.map((r,i)=>'<div class="rubric-score"><div><label for="rubric_'+i+'">'+r[0]+'</label><div class="small muted" id="rubric_desc_'+i+'">'+(state.fields['rubric_'+i]?r[1][Number(state.fields['rubric_'+i])-1]:'Read the descriptors below before choosing.')+'</div></div><select id="rubric_'+i+'" data-field="rubric_'+i+'"><option value="">Choose…</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(state.fields['rubric_'+i]===String(n)?'selected':'')+'>'+n+' / 5</option>').join('')+'</select></div>').join('')+'<details><summary>View the full assessment rubric</summary><div class="inside rubric-wrap"><table><thead><tr><th scope="col">Criterion</th>'+[5,4,3,2,1].map(n=>'<th scope="col">Score '+n+'</th>').join('')+'</tr></thead><tbody>'+RUBRIC.map(r=>'<tr><th scope="row">'+r[0]+'</th>'+[4,3,2,1,0].map(n=>'<td>'+r[1][n]+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details><div class="section-title"><h2>Your exit ticket</h2></div><div class="card">'+field('exit_evidence','1. One interpretation I can support','Name the book, give your idea and add a specific scene or visual detail.')+field('exit_question','2. One follow-up question I can ask','Write a question that invites explanation, not just yes or no.')+field('exit_strength','3. A speaking strength I demonstrated','Give an example from your rehearsal.')+field('exit_next','4. My next step','What is still difficult? What exactly will you practise next, and when?')+'<label class="field">5. My confidence now<select data-field="exit_confidence"><option value="">Choose…</option>'+['1 — I need a lot of support','2 — I am finding my way','3 — I am getting there','4 — I feel mostly ready','5 — I feel ready to discuss'].map(x=>'<option '+(state.fields.exit_confidence===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="field">6. Teacher support<select data-field="exit_support"><option value="">Choose…</option>'+['I can continue independently','I would like help choosing evidence','I would like language support','I would like help with speaking confidence','I have another question for my teacher'].map(x=>'<option '+(state.fields.exit_support===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+field('exit_help','Anything I want my teacher to know','Optional. No message is sent automatically.')+'</div><div class="callout"><strong>Your ideas, ready to take with you.</strong><p class="small">Download your preparation workbook as a PDF or text file. Drafts can be downloaded at any time. A separate cue sheet contains only your keyword prompts. Confirm with your teacher which notes are allowed during the assessment.</p><div id="downloadState" class="small"></div><div class="actions"><button class="accent" id="downloadPDF">Download workbook · PDF</button><button id="downloadTXT">Download · text</button><button id="downloadCues">Download cue sheet · PDF</button></div><p class="small" style="margin-top:16px">Keep your editable backup too: use Save / restore. Hand in files only through the method your teacher requests; the app does not submit them.</p></div>';}
const PAGES=[home,books,reading,city,toolkit,prepare,rehearse,reflect];
function render(focus=false){document.getElementById('nav').innerHTML=MODULES.map((m,i)=>'<button class="nav-item '+(state.page===i?'active ':'')+(state.done.includes(i)?'done':'')+'" data-go="'+i+'" '+(state.page===i?'aria-current="step"':'')+'><span class="nav-num">'+(state.done.includes(i)?'✓':String(i+1).padStart(2,'0'))+'</span>'+m+'</button>').join('');document.getElementById('progressLabel').textContent=state.done.length+' of 8 stops complete';document.getElementById('mobileProgress').textContent=state.done.length+' / 8 stops marked complete';document.getElementById('progressFill').style.width=state.done.length/8*100+'%';document.getElementById('main').innerHTML='<div class="crumb"><span>Your journey / '+MODULES[state.page]+'</span><span>ENGLISH · 5DA</span></div>'+PAGES[state.page]()+'<div class="footer-nav"><button data-go="'+Math.max(0,state.page-1)+'" '+(state.page===0?'disabled':'')+'>← Previous stop</button><button id="markDone">'+(state.done.includes(state.page)?'✓ Marked complete · undo':'Mark this stop complete')+'</button>'+(state.page<7?'<button class="primary" data-go="'+(state.page+1)+'">Next stop →</button>':'<button data-go="0">Back to mission ↑</button>')+'</div><p class="footer-source">Based on your teacher’s Speaking OLT assignment (Christmas 2025 document). No current deadline is set here. Practice activities and coaching are supplementary. Reading levels follow the assignment; fuller titles follow the supplied Teams file list.</p>';save();updateReady();if(focus){document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function updateReady(){const r=document.getElementById('readiness');if(r)r.innerHTML=readyHTML();const d=document.getElementById('downloadState');if(d)d.textContent=readiness().every(r=>r[1])?'✓ All completion checks met. Review your ideas, then download.':'Draft preparation: some completion checks remain. You can still download your work.';}
function go(n){state.page=n;render(true);}
function modal(html){const old=document.activeElement;document.getElementById('modalHost').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="Workbook tools">'+html+'<div class="actions"><button id="closeModal">Close</button></div></section></div>';document.getElementById('closeModal').focus();modal.old=old;}
function closeModal(){document.getElementById('modalHost').innerHTML='';if(modal.old&&modal.old.isConnected)modal.old.focus();}
function teams(){modal('<h2>Your comics are in Teams</h2><p>Open Microsoft Teams, select your English class team and find the folder containing the comic-book PDFs. Match the filenames with the 14 titles in this app.</p><p class="small muted">The exact team, channel and folder link were not provided. Ask your teacher if you cannot find the folder.</p><a href="https://teams.microsoft.com/" target="_blank" rel="noopener">Open Microsoft Teams ↗</a>');}
function download(content,name,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Download prepared. Check your browser’s downloads.');}
function plain(v){return (v||'').trim()||'[Not completed yet]';}
function workbookLines(cues=false){let lines=['PANEL / NYC — '+(cues?'MY KEYWORD CUE SHEET':'MY PREPARATION WORKBOOK'),'', 'Name: '+plain(state.fields.name),'Reading route: '+routeName(),'Books: '+(selectedBooks().map(b=>b.title+' (level '+b.level+')').join('; ')||'[No books selected]'),''];if(cues){lines.push('For rehearsal. Ask your teacher which notes are allowed in the assessment.','');TOPICS.forEach(t=>lines.push(t[1].toUpperCase(),plain(state.fields[t[0]+'_cue']),''));return lines;}
lines.push('Status: '+(readiness().every(r=>r[1])?'Completion checks met — review quality with your rubric.':'DRAFT — some completion checks remain.'),'Task: about 5–7 minutes overall; two approximate 2–3-minute sections. Home answers: 1–2 minutes.','','READING LOG');selectedBooks().forEach(b=>lines.push(b.title,'Finished reading: '+(state.checks['read_'+b.id]?'Yes':'Not yet'),plain(state.fields['log_'+b.id]),''));lines.push('Words from my reading',plain(state.fields.vocab),'','CITY & STORY','Actual setting: '+plain(state.fields.city_actual),'Research connection: '+plain(state.fields.city_link),'','MY TOPIC PREPARATION');TOPICS.forEach(t=>{lines.push(t[1].toUpperCase());[['idea','Opening idea'],['evidence','Supporting details and evidence'],['connection','Connection and conclusion'],['questions','Follow-up questions and possible responses'],['cue','Keyword cues']].forEach(([k,l])=>lines.push(l+':',plain(state.fields[t[0]+'_'+k])));lines.push('Self-check: '+(state.checks['topic_'+t[0]]?'I can explain this aloud with evidence.':'Not yet checked.'),'');});lines.push('OPTIONAL CREATIVE CONNECTION',plain(state.fields.creative),'','MY PHRASE BANK');FUNCTIONS.forEach(f=>lines.push(f[1],plain(state.fields['phrase_'+f[0]]),''));lines.push('REHEARSAL',plain(state.fields.rehearsal),'Partner feedback: '+plain(state.fields.peer),'','RUBRIC SELF-REFLECTION (not teacher grades)');RUBRIC.forEach((r,i)=>{const n=Number(state.fields['rubric_'+i]);lines.push(r[0]+': '+(n?n+'/5 — '+r[1][n-1]:'Not rated'));});lines.push('','EXIT TICKET');[['exit_evidence','An interpretation and its evidence'],['exit_question','A follow-up question'],['exit_strength','A speaking strength'],['exit_next','My next practice step'],['exit_confidence','Confidence'],['exit_support','Teacher support'],['exit_help','Anything else']].forEach(([k,l])=>lines.push(l+':',plain(state.fields[k]),''));lines.push('COMPLETION CHECKS');readiness().forEach(r=>lines.push((r[1]?'[x] ':'[ ] ')+r[0]));lines.push('','Source: Speaking OLT Christmas 5DA Christmas 2025, supplied by the teacher.','Practice activities and coaching are supplementary.','This file is not submitted automatically.');return lines;}
function ascii(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,' - ').replace(/…/g,'...').replace(/→/g,' -> ').replace(/[^\x20-\x7E]/g,'?');}
function pdfBytes(lines){const wrapped=[];lines.forEach(line=>String(line).split('\n').forEach(part=>{let s=ascii(part);if(!s){wrapped.push('');return;}while(s.length>88){let cut=s.lastIndexOf(' ',88);if(cut<20)cut=88;wrapped.push(s.slice(0,cut));s=s.slice(cut).trimStart();}wrapped.push(s);}));const chunks=[];for(let i=0;i<wrapped.length;i+=46)chunks.push(wrapped.slice(i,i+46));const objs=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];const kids=[];const escapePDF=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');chunks.forEach((chunk,i)=>{const pageID=objs.length;const streamID=pageID+1;kids.push(pageID+' 0 R');let stream='BT /F1 10 Tf 14 TL 46 787 Td\n'+chunk.map((s,n)=>(n?'T* ':'')+'('+escapePDF(s)+') Tj').join('\n')+'\nET\nBT /F1 9 Tf 46 30 Td (PANEL / NYC  |  '+(i+1)+' / '+chunks.length+') Tj ET';objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents '+streamID+' 0 R >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');});objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+chunks.length+' >>';let out='%PDF-1.4\n',offsets=[0];for(let i=1;i<objs.length;i++){offsets.push(out.length);out+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}const start=out.length;out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';offsets.slice(1).forEach(n=>out+=String(n).padStart(10,'0')+' 00000 n \n');out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF';return new TextEncoder().encode(out);}
function exportPDF(cues){download(pdfBytes(workbookLines(cues)),cues?'panel-nyc-cue-sheet.pdf':'panel-nyc-preparation.pdf','application/pdf');}
function backupModal(){modal('<h2>Keep your work with you.</h2><p>Your notes save in this browser when storage is available. They do not sync between devices. Download a backup before changing devices or clearing browser data.</p><div class="actions"><button class="primary" id="exportBackup">Download editable backup</button><button id="restoreBackup">Restore a backup</button></div><p class="small" style="margin-top:18px">A backup is a JSON file for this app. Restoring replaces the current notes after confirmation.</p><hr><button id="resetAll">Clear my saved work…</button>');}
function stopTimer(){clearInterval(timerInterval);timerInterval=null;}
function tick(){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));const display=document.getElementById('timerDisplay');if(display)display.textContent=timerText();if(timerRemaining===0){stopTimer();const b=document.getElementById('timerStart');if(b)b.textContent='Start';const s=document.getElementById('timerStatus');if(s)s.textContent='Time is up. Finish your thought and reflect.';toast('Time is up. Finish your thought, then reflect.');}}
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(key){state.fields[key]=e.target.value;save();updateReady();if(key.startsWith('rubric_')){const i=Number(key.split('_')[1]);document.getElementById('rubric_desc_'+i).textContent=e.target.value?RUBRIC[i][1][Number(e.target.value)-1]:'Read the descriptors below before choosing.';}}});
document.addEventListener('change',e=>{if(e.target.dataset.check){state.checks[e.target.dataset.check]=e.target.checked;save();updateReady();}if(e.target.id==='timerMode'){stopTimer();timerSeconds=Number(e.target.value);timerRemaining=timerSeconds;document.getElementById('timerDisplay').textContent=timerText();document.getElementById('timerStart').textContent='Start';document.getElementById('timerStatus').textContent='Ready when you are';}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go!==undefined){go(Number(d.go));return;}if(d.route){state.route=d.route;render();return;}if(d.book){state.selected=state.selected.includes(d.book)?state.selected.filter(x=>x!==d.book):[...state.selected,d.book];render();return;}if(d.borough){borough=d.borough;render();return;}if(d.quiz){const [g,i]=d.quiz.split('_');const chosen=document.querySelector('input[name="q_'+d.quiz+'"]:checked');if(!chosen){toast('Choose an answer first.');return;}const n=Number(chosen.value);state.quiz[d.quiz]=n;save();const f=document.getElementById('feedback_'+d.quiz),q=QUIZZES[g][Number(i)];f.className='feedback '+(n===q[2]?'':'wrong');f.textContent=(n===q[2]?'✓ Correct. ':'Try again. ')+q[3];return;}if(d.teams!==undefined){teams();return;}switch(b.id){case'teamsSide':teams();break;case'workbookButton':go(7);break;case'backupButton':backupModal();break;case'closeModal':closeModal();break;case'exportBackup':download(JSON.stringify(state,null,2),'panel-nyc-backup.json','application/json');break;case'restoreBackup':document.getElementById('importFile').click();break;case'resetAll':modal('<h2>Clear all your work?</h2><p>This removes your notes, book selections and progress from this browser. Download a backup first if you want to keep them.</p><button id="confirmReset" class="accent">Yes, clear my saved work</button>');break;case'confirmReset':state=structuredClone(DEFAULT);stopTimer();timerSeconds=120;timerRemaining=120;closeModal();render(true);toast('Saved work cleared.');break;case'markDone':state.done=state.done.includes(state.page)?state.done.filter(x=>x!==state.page):[...state.done,state.page];render();break;case'downloadPDF':exportPDF(false);break;case'downloadCues':exportPDF(true);break;case'downloadTXT':download(workbookLines(false).join('\n'),'panel-nyc-preparation.txt','text/plain;charset=utf-8');break;case'showCues':document.getElementById('cueCards').classList.toggle('hidden');break;case'nextPrompt':promptIndex=(promptIndex+1)%PROMPTS.length;document.getElementById('promptText').textContent=PROMPTS[promptIndex];break;case'timerReset':stopTimer();timerRemaining=timerSeconds;document.getElementById('timerDisplay').textContent=timerText();document.getElementById('timerStart').textContent='Start';document.getElementById('timerStatus').textContent='Ready when you are';break;case'timerStart':if(timerInterval){tick();stopTimer();b.textContent='Resume';document.getElementById('timerStatus').textContent='Paused';}else{if(timerRemaining<=0)timerRemaining=timerSeconds;timerEnd=Date.now()+timerRemaining*1000;timerInterval=setInterval(tick,250);b.textContent='Pause';document.getElementById('timerStatus').textContent='Timer running';}break;case'confirmImport':state=importCandidate;stopTimer();closeModal();render(true);toast('Backup restored.');break;}});
let importCandidate=null;
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>3000000)throw Error('Too large');const parsed=JSON.parse(await file.text());if(!validState(parsed))throw Error('Invalid backup');importCandidate=parsed;modal('<h2>Restore this backup?</h2><p>This will replace your current notes and progress with the selected backup. Download your current work first if you need to keep both.</p><button id="confirmImport" class="accent">Replace current work and restore</button>');}catch(err){toast('That file is not a valid Panel / NYC backup. Your current work is unchanged.');}e.target.value='';});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const nodes=dialog.querySelectorAll('button,a[href],input,select,textarea');const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
